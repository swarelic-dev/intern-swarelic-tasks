<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCAI WebSocket Echo Client</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --bubble-user: #2563eb;
            --bubble-server: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 80vh;
        }

        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.825rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-pill.connected {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .connection-bar {
            padding: 0.75rem 1.5rem;
            background: rgba(15, 23, 42, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .connection-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: #475569;
            color: #f8fafc;
        }

        .btn-danger:hover:not(:disabled) {
            background: #64748b;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.925rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-row.sent .message-bubble {
            background-color: var(--bubble-user);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message-row.received .message-bubble {
            background-color: var(--bubble-server);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message-meta {
            font-size: 0.725rem;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .input-bar {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            gap: 10px;
        }

        .input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.925rem;
        }

        .input-bar input:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>SCAI WebSocket Echo Client</h1>
                <div class="subtitle">VoiceCallConsumer Real-Time Protocol Prototype</div>
            </div>
            <div id="statusPill" class="status-pill">
                <span class="status-dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="connection-bar">
            <input type="text" id="serverUrl" value="ws://localhost:8765" placeholder="WebSocket Server URL">
            <button id="connectBtn" class="btn-primary" onclick="toggleConnection()">Connect</button>
            <button class="btn-danger" onclick="clearMessages()">Clear</button>
        </div>

        <div id="messagesContainer" class="messages-container">
            <div id="emptyState" class="empty-state">
                Connect to the server and send a message to test the echo loop.
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="messageInput" placeholder="Type a message to echo..." disabled onkeydown="handleKeyDown(event)">
            <button id="sendBtn" class="btn-primary" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let ws = null;
        const serverUrlInput = document.getElementById('serverUrl');
        const connectBtn = document.getElementById('connectBtn');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const messagesContainer = document.getElementById('messagesContainer');
        const emptyState = document.getElementById('emptyState');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function toggleConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            } else {
                connect();
            }
        }

        function connect() {
            const url = serverUrlInput.value.trim();
            if (!url) return;

            statusText.textContent = "Connecting...";
            statusPill.className = "status-pill";
            connectBtn.disabled = true;

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    statusText.textContent = "Connected";
                    statusPill.className = "status-pill connected";
                    connectBtn.textContent = "Disconnect";
                    connectBtn.disabled = false;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    messageInput.focus();
                };

                ws.onmessage = (event) => {
                    appendMessage(event.data, "received");
                };

                ws.onclose = () => {
                    handleDisconnect();
                };

                ws.onerror = (err) => {
                    console.error("WebSocket error:", err);
                    handleDisconnect();
                };
            } catch (err) {
                console.error("Connection attempt error:", err);
                handleDisconnect();
            }
        }

        function handleDisconnect() {
            statusText.textContent = "Disconnected";
            statusPill.className = "status-pill";
            connectBtn.textContent = "Connect";
            connectBtn.disabled = false;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            ws = null;
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const text = messageInput.value.trim();
            if (!text) return;

            ws.send(text);
            appendMessage(text, "sent");
            messageInput.value = "";
            messageInput.focus();
        }

        function handleKeyDown(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function appendMessage(text, type) {
            if (emptyState) {
                emptyState.style.display = "none";
            }

            const row = document.createElement("div");
            row.className = `message-row ${type}`;

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = text;

            const meta = document.createElement("div");
            meta.className = "message-meta";
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            meta.textContent = type === "sent" ? `You • ${timeStr}` : `Server • ${timeStr}`;

            row.appendChild(bubble);
            row.appendChild(meta);
            messagesContainer.appendChild(row);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function clearMessages() {
            messagesContainer.innerHTML = "";
            if (emptyState) {
                emptyState.style.display = "block";
                messagesContainer.appendChild(emptyState);
            }
        }
    </script>
</body>
</html>
